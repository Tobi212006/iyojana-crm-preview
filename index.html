<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iYojana | Financial Advisor CRM Preview</title><style>
:root{font-family:Inter,system-ui,Arial;color:#1c2940;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}aside{background:#10233e;color:white;width:230px;padding:22px 12px;min-height:100vh;position:sticky;top:0;align-self:start}.brand{font-weight:800;font-size:25px;padding:5px 13px 24px}.brand b{color:#8bb9ff}.shell{display:flex}main{padding:28px;flex:1;min-width:0}.nav{display:block;border:0;background:none;color:#c5d3e5;text-align:left;width:100%;padding:12px;border-radius:9px;margin:3px 0}.nav.active,.nav:hover{background:#30496b;color:white}header,.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header{margin-bottom:22px}h1{font-size:27px;margin:0}h2{font-size:18px;margin:0 0 16px}.muted{font-size:13px;color:#71809a}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.card,.panel{background:white;border:1px solid #e3e9f2;border-radius:14px;padding:19px;box-shadow:0 3px 12px #1b365108}.card strong{display:block;font-size:27px;margin-top:9px}.panels{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.panel{overflow:auto;margin-bottom:16px}.btn{border:0;border-radius:8px;background:#345bd5;color:white;padding:10px 14px}.btn.alt{background:#eaf0fd;color:#31539d}.toolbar{justify-content:flex-start;margin-bottom:15px}input,select{border:1px solid #d4deec;border-radius:8px;padding:10px;max-width:100%}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:11px 9px;border-bottom:1px solid #edf0f5}th{color:#73809a;font-size:12px}.pill{background:#eaf1ff;color:#3154a1;padding:5px 8px;border-radius:30px;font-size:12px}.warn{background:#ffeded;color:#a43a36}.note{background:#edf4ff;color:#476080;padding:12px;border-radius:9px;font-size:13px;margin:14px 0}.form{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.form label{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}.empty{text-align:center;color:#8793a5;padding:24px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}aside{width:180px}}@media(max-width:600px){.shell{display:block}aside{width:100%;min-height:auto;position:static}.brand{padding-bottom:9px}.menu{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}main{padding:15px}}
</style></head><body><div class="shell"><aside><div class="brand">i<b>Yojana</b> CRM</div><div class="menu" id="menu"></div><p style="font-size:11px;color:#adbed4;padding:10px">DEMO ONLY · Fictional records</p></aside><main><header><div><h1 id="heading">Today's Work</h1><div class="muted">Financial advisor workspace · Interactive design preview</div></div><select id="role" onchange="render()"><option value="all">Owner · All Data</option><option value="A1">Advisor 1</option><option value="A2">Advisor 2</option></select></header><div id="view"></div></main></div><script>
const initial={clients:[{id:1,name:"Aarav Mehta",advisor:"A1",phone:"9000000001",birthday:"11-22",product:"Mutual Fund SIP",amount:15000,review:"2026-11-22",goal:"Retirement",kyc:"Verified"},{id:2,name:"Diya Shah",advisor:"A2",phone:"9000000002",birthday:"04-14",product:"LIC Insurance",amount:9000,review:"2026-11-25",goal:"Education",kyc:"Pending"},{id:3,name:"Kabir Rao",advisor:"A1",phone:"9000000003",birthday:"07-19",product:"Home Loan",amount:25000,review:"2026-11-23",goal:"Home",kyc:"Verified"},{id:4,name:"Anaya Desai",advisor:"A2",phone:"9000000004",birthday:"11-22",product:"SIP",amount:12000,review:"2026-11-22",goal:"Wealth",kyc:"Verified"}],leads:[{id:1,name:"Riya Kulkarni",advisor:"A1",stage:"Meeting",source:"Referral"},{id:2,name:"Om Patil",advisor:"A2",stage:"Follow-up",source:"Partner"}],tasks:[{id:1,title:"Review Aarav's SIP",advisor:"A1",date:"2026-11-22",priority:"High",done:false},{id:2,title:"Call Diya about renewal",advisor:"A2",date:"2026-11-22",priority:"High",done:false},{id:3,title:"Meet Kabir about loan",advisor:"A1",date:"2026-11-23",priority:"Medium",done:false},{id:4,title:"Portfolio review",advisor:"A2",date:"2026-11-20",priority:"High",done:false}],meetings:[{id:1,title:"Kabir · Loan discussion",advisor:"A1",date:"2026-11-23",time:"11:00"},{id:2,title:"Anaya · Portfolio review",advisor:"A2",date:"2026-11-24",time:"15:30"}]};
let db=JSON.parse(localStorage.getItem("iyojana-v1")||"null")||initial,page="Today's Work",pending=[];const pages=["Today's Work","Client Master","Lead Master","Tasks & Follow-ups","Meetings & Calendar","Investment Master","Financial Goals","Smart Import","Revenue & Reports"];const save=()=>localStorage.setItem("iyojana-v1",JSON.stringify(db));const role=()=>document.getElementById("role").value;const mine=x=>role()==="all"||x.advisor===role();const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=x=>"₹"+Number(x||0).toLocaleString("en-IN");const card=(label,value)=>'<div class="card"><div class="muted">'+label+'</div><strong>'+value+'</strong></div>';const table=(head,body)=>'<table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'+(body||'<tr><td colspan="'+head.length+'" class="empty">No records</td></tr>')+'</tbody></table>';const pill=x=>'<span class="pill '+(x==="High"||x==="Overdue"?"warn":"")+'">'+esc(x)+'</span>';const button=(label,action)=>'<button class="btn" onclick="'+action+'">'+label+'</button>';
function render(){document.getElementById("heading").textContent=page;document.getElementById("menu").innerHTML=pages.map(p=>'<button class="nav '+(p===page?"active":"")+'" onclick="go(\''+p+'\')">'+p+'</button>').join("");let c=db.clients.filter(mine),l=db.leads.filter(mine),t=db.tasks.filter(mine),m=db.meetings.filter(mine),out="";
if(page==="Today's Work")out='<div class="cards">'+card("Clients",c.length)+card("Open Tasks",t.filter(x=>!x.done).length)+card("Meetings",m.length)+card("Active Leads",l.filter(x=>x.stage!=="Converted").length)+'</div><div class="panels"><section class="panel"><h2>Priorities & follow-ups</h2>'+table(["Task","Due","Priority","Action"],t.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+(x.date<"2026-11-22"?pill("Overdue"):x.date)+'</td><td>'+pill(x.priority)+'</td><td><button class="btn alt" onclick="toggle('+x.id+')">Complete</button></td></tr>').join(""))+'</section><section class="panel"><h2>Birthdays today</h2>'+ (c.filter(x=>x.birthday==="11-22").map(x=>'<p><b>'+esc(x.name)+'</b> · <button class="btn alt" onclick="wish('+x.id+')">Copy greeting</button></p>').join("")||'<p class="muted">None today</p>')+'<h2>Upcoming meetings</h2>'+m.map(x=>'<p>'+x.date+' · '+x.time+' · '+esc(x.title)+'</p>').join("")+'</section></div>';
if(page==="Client Master")out='<section class="panel"><div class="toolbar"><input id="q" placeholder="Search clients" oninput="searchClients()">'+button("+ Add Client","addClient()")+'</div><div id="clientrows">'+clientRows(c)+'</div></section>';
if(page==="Lead Master")out='<section class="panel"><div class="toolbar">'+button("+ Add Lead","addLead()")+'</div>'+table(["Lead","Advisor","Source","Pipeline stage","Action"],l.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.advisor+'</td><td>'+esc(x.source)+'</td><td>'+pill(x.stage)+'</td><td><button class="btn alt" onclick="advance('+x.id+')">Next stage</button></td></tr>').join(""))+'</section>';
if(page==="Tasks & Follow-ups")out='<section class="panel"><div class="toolbar">'+button("+ New Task","addTask()")+'</div>'+table(["Task","Advisor","Due","Priority","Status","Action"],t.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+x.advisor+'</td><td>'+x.date+'</td><td>'+pill(x.priority)+'</td><td>'+pill(x.done?"Done":"Open")+'</td><td><button class="btn alt" onclick="toggle('+x.id+')">'+(x.done?"Reopen":"Complete")+'</button></td></tr>').join(""))+'</section>';
if(page==="Meetings & Calendar")out='<section class="panel"><div class="toolbar">'+button("+ Schedule Meeting","addMeeting()")+'</div>'+table(["Meeting","Advisor","Date","Time","Action"],m.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+x.advisor+'</td><td>'+x.date+'</td><td>'+x.time+'</td><td><button class="btn alt" onclick="calendar('+x.id+')">Add to Google Calendar</button></td></tr>').join(""))+'<p class="note">Calendar opens a prefilled event for review. Two-way synchronization is not enabled.</p></section>';
if(page==="Investment Master")out='<div class="cards">'+card("Client product records",c.length)+card("SIP records",c.filter(x=>x.product.toLowerCase().includes("sip")).length)+card("Recorded amounts",money(c.reduce((s,x)=>s+Number(x.amount),0)))+card("Advisors",role()==="all"?"2":"1")+'</div><section class="panel"><h2>Products, KYC & account opening</h2>'+table(["Client","Product","Recorded amount","KYC","Advisor"],c.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.product)+'</td><td>'+money(x.amount)+'</td><td>'+pill(x.kyc)+'</td><td>'+x.advisor+'</td></tr>').join(""))+'<p class="note">Illustrative product amounts are not company revenue or verified portfolio valuation.</p></section>';
if(page==="Financial Goals")out='<section class="panel"><h2>Client financial goals</h2>'+table(["Client","Goal","Advisor","Review"],c.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+pill(x.goal)+'</td><td>'+x.advisor+'</td><td>'+esc(x.review)+'</td></tr>').join(""))+'</section><section class="panel"><h2>SIP projection calculator</h2><div class="form"><label>Monthly contribution ₹<input type="number" id="sip" value="5000" min="0" oninput="calc()"></label><label>Years<input type="number" id="years" value="10" min="1" max="50" oninput="calc()"></label><label>Assumed annual return %<input type="number" id="rate" value="10" min="-50" max="50" oninput="calc()"></label></div><div id="result"></div><p class="note">Illustrative only; no guaranteed returns. Assumes month-end contributions and constant nominal rate compounded monthly.</p></section>';
if(page==="Smart Import")out='<section class="panel"><h2>Partner data import</h2><p class="muted">CSV import with validation, preview, advisor ownership and duplicate phone-number checks.</p><input type="file" accept=".csv,text/csv" onchange="preview(event)"><div id="preview" class="note">Choose a CSV with columns: name, advisor, phone, product, amount, birthday, review, goal, kyc. Advisor must be A1 or A2.</div><p class="note">Excel and PDF extraction are planned integrations, not implemented in this frontend demonstration. Do not upload real confidential client information.</p></section>';
if(page==="Revenue & Reports")out='<div class="cards">'+card("Leads",l.length)+card("Converted leads",l.filter(x=>x.stage==="Converted").length)+card("Clients",c.length)+card("Completed tasks",t.filter(x=>x.done).length)+'</div><section class="panel"><h2>Advisor performance</h2>'+table(["Advisor","Clients","Open tasks","Leads","Meetings"],["A1","A2"].filter(a=>role()==="all"||role()===a).map(a=>'<tr><td>'+a+'</td><td>'+db.clients.filter(x=>x.advisor===a).length+'</td><td>'+db.tasks.filter(x=>x.advisor===a&&!x.done).length+'</td><td>'+db.leads.filter(x=>x.advisor===a).length+'</td><td>'+db.meetings.filter(x=>x.advisor===a).length+'</td></tr>').join(""))+'<p class="note">Revenue reporting needs actual commission/fee records. SIP amounts must not be treated as revenue.</p></section>';
document.getElementById("view").innerHTML=out;if(page==="Financial Goals")calc()}
function go(p){page=p;render()}function toggle(id){let x=db.tasks.find(x=>x.id===id);x.done=!x.done;save();render()}function wish(id){let x=db.clients.find(x=>x.id===id),msg="Happy birthday, "+x.name+"! Best wishes from iYojana.";if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>alert("Greeting copied")).catch(()=>prompt("Copy greeting",msg));else prompt("Copy greeting",msg)}
function clientRows(c){return table(["Client","Advisor","Product","Amount","KYC","Review"],c.map(x=>'<tr><td><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.phone)+'</div></td><td>'+x.advisor+'</td><td>'+esc(x.product)+'</td><td>'+money(x.amount)+'</td><td>'+pill(x.kyc)+'</td><td>'+esc(x.review)+'</td></tr>').join(""))}
function searchClients(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("clientrows").innerHTML=clientRows(db.clients.filter(mine).filter(x=>x.name.toLowerCase().includes(q)||x.phone.includes(q)))}
function askAdvisor(){let a=prompt("Assign advisor A1 or A2",role()==="all"?"A1":role());if(!["A1","A2"].includes(a)){alert("Advisor must be A1 or A2");return null}return a}
function addClient(){let name=prompt("Client name");if(!name?.trim())return;let advisor=askAdvisor();if(!advisor)return;db.clients.push({id:Date.now(),name:name.trim(),advisor,phone:"",birthday:"",product:"Unspecified",amount:0,review:"",goal:"Not set",kyc:"Pending"});save();render()}
function addLead(){let name=prompt("Lead name");if(!name?.trim())return;let advisor=askAdvisor();if(!advisor)return;db.leads.push({id:Date.now(),name:name.trim(),advisor,stage:"New",source:"Manual"});save();render()}
function advance(id){let x=db.leads.find(x=>x.id===id),stages=["New","Contacted","Meeting","Follow-up","KYC","Account Opening","Converted"];x.stage=stages[Math.min(stages.indexOf(x.stage)+1,stages.length-1)];save();render()}
function addTask(){let title=prompt("Task description");if(!title?.trim())return;let advisor=askAdvisor();if(!advisor)return;let date=prompt("Due date YYYY-MM-DD","2026-11-23");if(!/^\d{4}-\d{2}-\d{2}$/.test(date||""))return alert("Invalid date");db.tasks.push({id:Date.now(),title:title.trim(),advisor,date,priority:"Medium",done:false});save();render()}
function addMeeting(){let title=prompt("Meeting title");if(!title?.trim())return;let advisor=askAdvisor();if(!advisor)return;let date=prompt("Date YYYY-MM-DD","2026-11-23"),time=prompt("Time HH:MM","11:00");if(!/^\d{4}-\d{2}-\d{2}$/.test(date||"")||!/^\d{2}:\d{2}$/.test(time||""))return alert("Invalid date/time");db.meetings.push({id:Date.now(),title:title.trim(),advisor,date,time});save();render()}
function calendar(id){let x=db.meetings.find(x=>x.id===id),d=x.date.replaceAll("-",""),start=x.time.replace(":","")+"00";window.open("https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(x.title)+"&dates="+d+"T"+start+"/"+d+"T"+start+"&ctz=Asia%2FKolkata","_blank","noopener")}
function calc(){let p=Number(document.getElementById("sip").value),y=Number(document.getElementById("years").value),r=Number(document.getElementById("rate").value)/1200,n=Math.round(y*12);if(!Number.isFinite(p)||!Number.isFinite(y)||!Number.isFinite(r)||p<0||y<1||n>600||r<=-1)return;let fv=Math.abs(r)<1e-10?p*n:p*(Math.pow(1+r,n)-1)/r;document.getElementById("result").innerHTML='<div class="cards" style="grid-template-columns:repeat(3,1fr)">'+card("Invested",money(p*n))+card("Projected value",money(Math.round(fv)))+card("Illustrative gain",money(Math.round(fv-p*n)))+'</div>'}
function parseCSV(text){let rows=[],row=[],cell="",quote=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(ch===","&&!quote){row.push(cell);cell=""}else if((ch==="\n"||ch==="\r")&&!quote){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=""}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function preview(e){let file=e.target.files[0];if(!file)return;if(file.size>2000000)return alert("Demo CSV limit 2 MB");file.text().then(txt=>{let rows=parseCSV(txt),head=(rows.shift()||[]).map(x=>x.trim().toLowerCase());if(!["name","advisor"].every(x=>head.includes(x)))return alert("CSV requires name and advisor columns");pending=rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()]))).filter(x=>x.name&&["A1","A2"].includes(x.advisor));document.getElementById("preview").innerHTML='<b>'+pending.length+' valid rows</b> of '+rows.length+'. Duplicate phone numbers will be skipped. <button class="btn" onclick="importRows()">Confirm import</button>'})}
function importRows(){let n=0;for(let x of pending){if(x.phone&&db.clients.some(c=>c.phone===x.phone))continue;db.clients.push({id:Date.now()+n++,name:x.name,advisor:x.advisor,phone:x.phone||"",birthday:x.birthday||"",product:x.product||"Unspecified",amount:Number(x.amount)||0,review:x.review||"",goal:x.goal||"Not set",kyc:x.kyc||"Pending"})}pending=[];save();alert(n+" client records imported");go("Client Master")}render();
</script></body></html>
